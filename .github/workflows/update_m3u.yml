name: Tự động cập nhật Saoke M3U

on:
  schedule:
    # Tự động chạy mỗi 30 phút một lần
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cài đặt Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Chạy script cập nhật
        run: python saoke_m3u.py

      - name: Commit và Push file M3U mới
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add saoke.m3u
          git commit -m "Auto update saoke.m3u playlist" || exit 0
          git push


name: Auto Update SaoKeTV M3U

on:
  schedule:
    # Tự động chạy mỗi 30 phút một lần (múi giờ UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Nút bấm kích hoạt chạy thủ công trên giao diện GitHub

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền ghi để GitHub Actions push file saoketv.m3u lên kho

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Run Script
        run: python generate_m3u.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add saoketv.m3u
          git commit -m "Auto update SaoKeTV playlist [skip ci]" || exit 0
          git push
          

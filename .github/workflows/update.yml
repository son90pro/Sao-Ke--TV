name: Auto Update SaoKeTV M3U

on:
  schedule:
    # Chạy tự động mỗi 30 phút
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền cho GitHub Actions commit & push file .m3u

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 requests

      - name: Run Script
        run: python generate_m3u.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add saoketv.m3u
          git commit -m "Auto update SaoKeTV playlist [skip ci]" || exit 0
          git push
          

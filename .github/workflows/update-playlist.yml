name: Update M3U Playlist

on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động 1 tiếng/lần (vào phút 0 mỗi giờ)
  workflow_dispatch:     # Nút bấm chạy thủ công

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python script
        run: |
          python main.py

      - name: Commit and Push M3U file
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add saoke_playlist.m3u
          git diff --staged --quiet || (git commit -m "Auto update M3U playlist [skip ci]" && git push)
          
